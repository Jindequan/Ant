<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Ant</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1024 1024'%3E%3Crect x='100' y='100' width='824' height='824' rx='185' fill='%231f1e1c'/%3E%3Cg transform='translate(144 164) scale(40)' fill='none' stroke='%23f3efe6' stroke-width='1.6' stroke-linecap='round' stroke-linejoin='round'%3E%3Cellipse cx='4.5' cy='10' rx='2.8' ry='2.2' transform='rotate(-10 4.5 10)'/%3E%3Cpath d='M7.4 9.4L11.4 8.8'/%3E%3Ccircle cx='13.6' cy='7.9' r='1.9'/%3E%3Cpath d='M14.3 6.1L15 4 16.7 3.5'/%3E%3Cpath d='M8.5 9.4L6.3 13.7M9.9 9.2V13.9M11.3 9.1L13.6 13.4'/%3E%3C/g%3E%3C/svg%3E">
<link rel="stylesheet" href="/app.css">
</head>
<body>
<div class="page">
  <header class="top">
    <div class="brand">
      <span class="logo" aria-hidden="true"><svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="4.5" cy="10" rx="2.8" ry="2.2" transform="rotate(-10 4.5 10)"/><path d="M7.4 9.4L11.4 8.8"/><circle cx="13.6" cy="7.9" r="1.9"/><path d="M14.3 6.1L15 4 16.7 3.5"/><path d="M8.5 9.4L6.3 13.7M9.9 9.2V13.9M11.3 9.1L13.6 13.4"/></svg></span>
      <h1>Ant</h1>
    </div>
    <div class="actions">
      <span id="updated" class="muted" aria-live="polite"></span>
      <button id="notify" type="button" class="icon-btn" aria-pressed="true" title="Notifications on this Mac" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9a6 6 0 0 1 12 0c0 6 2 7 2 7H4s2-1 2-7"/><path d="M10 20a2 2 0 0 0 4 0"/><path class="slash" d="M4 4l16 16"/></svg>
      </button>
      <button id="refresh" type="button" class="icon-btn" aria-label="Read every account again" title="Read every account again">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/></svg>
      </button>
      <button id="add" type="button" class="btn primary">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        <span>Add</span>
      </button>
    </div>
  </header>

  <div id="demo" class="demo" hidden>Sample data. Start Ant without <code>-demo</code> to read your own accounts.</div>

  <section id="summary" class="glance" aria-label="What to use first"></section>

  <div class="toolbar">
    <div class="views" role="tablist" aria-label="View">
      <button role="tab" data-view="cards">Accounts</button>
      <button role="tab" data-view="models">Models</button>
      <button role="tab" data-view="timeline">Timeline</button>
    </div>
    <label class="search">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/></svg>
      <input id="search" type="search" placeholder="Search" aria-label="Search accounts, models and what they make" autocomplete="off" spellcheck="false">
      <kbd aria-hidden="true">/</kbd>
    </label>
  </div>

  <main id="cards" aria-live="polite"></main>

  <footer class="foot-note">
    Ant finds the accounts of apps on this Mac and asks each provider only what you have left. It never spends it.
  </footer>
</div>

<dialog id="sheet" class="sheet" aria-labelledby="sheet-title">
  <form method="dialog" class="sheet-inner" id="sheet-form" novalidate>
    <header class="sheet-head">
      <button type="button" class="icon-btn" id="sheet-back" aria-label="Back" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>
      </button>
      <h2 id="sheet-title">Add account</h2>
      <button type="button" class="icon-btn" id="sheet-close" aria-label="Close">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </header>
    <div id="sheet-body" class="sheet-body"></div>
  </form>
</dialog>

<script src="/app.js"></script>
</body>
</html>
